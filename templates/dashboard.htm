<!DOCTYPE html>
<html lang="en">
<head>
    <title>ICEGODS | INTEL HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; }
        .glow { text-shadow: 0 0 10px #00ff00; }
        .row-item:hover { background: rgba(0, 255, 0, 0.05); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center border-b border-green-900 pb-6 mb-10">
            <div>
                <h1 class="text-4xl font-black glow">ICEGODS <span class="text-white">INTEL HUB</span></h1>
                <p class="text-[10px] tracking-widest uppercase">Alien-Grade Intelligence Aggregator</p>
            </div>
            <div class="text-right">
                <p class="text-xs">SYSTEM STATUS: <span class="animate-pulse">SYNCHRONIZED</span></p>
                <p class="text-xs text-gray-500">ENCRYPTION: QUANTUM-838</p>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-4">
            {% for item in feed %}
            <div class="row-item border border-green-900 p-4 flex justify-between items-center transition-all">
                <div class="flex gap-10">
                    <div class="w-32 text-[10px] text-gray-500">{{ item.created_at }}</div>
                    <div class="w-48 font-bold text-white text-sm">{{ item.bot_source }}</div>
                    <div class="w-64 text-green-400 font-mono">{{ item.target }}</div>
                </div>
                <div class="flex gap-10 items-center">
                    <div class="px-3 py-1 bg-green-900/20 border border-green-500 text-[10px] font-bold uppercase">
                        {{ item.ai_classification }}
                    </div>
                    <div class="text-white font-black">{{ item.valuation }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
